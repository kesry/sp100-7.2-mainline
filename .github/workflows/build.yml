name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  BOOT_SIZE: "33554432"

jobs:
  kernel:
    name: Build kernel, modules and boot image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio zstd python3

      - name: Kernel config
        run: |
          # arch/arm64/configs/gnt_an00_defconfig is the single source of truth
          # for this board - display, GPU, KVM, UFS, networking, AppArmor, the
          # PWM backlight and the container/VM prerequisites all live there.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gnt_an00_defconfig

      - name: Build kernel and modules
        run: |
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            Image modules dtbs
          # DTB is embedded; a stale object keeps the old blob
          rm -f arch/arm64/kernel/builtin-dtb.o
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Build connectivity modules
        run: |
          # conn/ is the vendor out-of-tree WMT/BTIF/gen4m stack behind
          # wlan0 and Bluetooth. Its .ko vermagic must equal this kernel's
          # UTS_VERSION - gnt-conn compares uname -v against the
          # kernel-release marker - so it has to be rebuilt every run.
          make -C . M="$PWD/conn" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            MTK_COMBO_CHIP=SOC2_1X1 WLAN_CHIP_ID=6833 CONFIG_MTK_COMBO_WIFI_HIF=axi \
            CONFIG_MTK_PLATFORM=mt6833 TARGET_BUILD_VARIANT=userdebug \
            CONFIG_MTK_COMBO_WIFI=m KBUILD_MODPOST_FAIL_ON_WARNINGS=n \
            MTK_WLAN_SERVICE=yes MTK_ANDROID_WMT=y MTK_ANDROID_EMI=y \
            modules
          mkdir -p conn/out
          for m in btif/common/btif.ko common/wmt_drv.ko \
                   wlan/adaptor/wmt_chrdev_wifi.ko \
                   wlan/core/gen4m/wlan_6833_axi.ko bt/hci/btmtk_stp.ko; do
            test -f "conn/$m" || { echo "conn build produced no conn/$m"; exit 1; }
            aarch64-linux-gnu-strip --strip-debug -o "conn/out/$(basename "$m")" "conn/$m"
          done
          sed -n 's/^#define UTS_VERSION "\(.*\)"$/\1/p' \
            include/generated/utsversion.h > conn/out/kernel-release

      - name: Stage modules
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH=./mods INSTALL_MOD_STRIP=1 modules_install
          V=$(ls mods/lib/modules)
          # vendor modules land under updates/ at exactly the subpaths the
          # flashed image uses, then one depmod covers in-tree + vendor
          # modules so modules.dep carries the btif/wmt_drv dependencies.
          mkdir -p mods/lib/modules/$V/updates/common \
                   mods/lib/modules/$V/updates/btif/common \
                   mods/lib/modules/$V/updates/bt/hci \
                   mods/lib/modules/$V/updates/wlan/adaptor \
                   mods/lib/modules/$V/updates/wlan/core/gen4m
          cp conn/out/wmt_drv.ko          mods/lib/modules/$V/updates/common/
          cp conn/out/btif.ko             mods/lib/modules/$V/updates/btif/common/
          cp conn/out/btmtk_stp.ko        mods/lib/modules/$V/updates/bt/hci/
          cp conn/out/wmt_chrdev_wifi.ko  mods/lib/modules/$V/updates/wlan/adaptor/
          cp conn/out/wlan_6833_axi.ko    mods/lib/modules/$V/updates/wlan/core/gen4m
          cp conn/out/kernel-release      mods/lib/modules/.conn-release
          depmod -a -b "$PWD/mods" "$V"
          tar -czf modules.tar.gz -C mods/lib/modules .

      - name: Pack boot image
        run: |
          python3 tools/build_boot.py arch/arm64/boot/Image boot.img

      - name: Verify boot image
        run: |
          SIZE=$(stat -c%s boot.img)
          echo "boot.img size: $SIZE"
          test "$SIZE" = "$BOOT_SIZE"
          python3 - <<'PY'
          import struct, gzip
          d = open('boot.img', 'rb').read()
          assert d[:8] == b'ANDROID!', 'not a boot image'
          ks = struct.unpack_from('<I', d, 8)[0]
          # build_boot.py stores the Image as a gzip stream. zlib.decompress()
          # chokes on the 1f 8b header ("incorrect header check"), which is what
          # killed this step: header kernel_size is the COMPRESSED length, so
          # slice exactly that window and let gzip decode it.
          raw = gzip.decompress(d[2048:2048 + ks])
          assert raw[0x38:0x3c] == b'ARMd', 'kernel magic missing'
          print(f'kernel raw: {len(raw):,} bytes')
          # the appended stock DTBO sits behind the ramdisk padding and carries
          # 64 private MTK bytes before the inner FDT, so locate the FDT by its
          # magic rather than trusting a header field
          off = d.find(b'\xd0\x0d\xfe\xed')
          assert off > 0, 'no appended DTB found'
          dsz = struct.unpack_from('>I', d, off + 4)[0]
          assert off + dsz <= len(d), 'DTB size runs past the image'
          print(f'appended dtb: {dsz:,} bytes at 0x{off:x}')
          print('boot image structure OK')
          PY

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-img
          path: boot.img

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: modules.tar.gz

  rootfs:
    name: Build rootfs image
    runs-on: ubuntu-latest
    needs: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Install debootstrap
        run: |
          sudo apt-get update -qq
          # qemu-user-static is what makes an arm64 debootstrap possible on an
          # x86_64 runner: debootstrap's second stage chroots into the target
          # and runs arm64 binaries. Without it the job dies at
          #   W: Failure trying to run: chroot ".../rootfs" /bin/true
          # debian-archive-keyring lets debootstrap verify the Release signature
          # instead of warning that the keyring is missing.
          sudo apt-get install -y --no-install-recommends \
            debootstrap e2fsprogs qemu-user-static debian-archive-keyring
          # The package ships a binfmt.d snippet; make sure the kernel actually
          # registered it before debootstrap runs.
          sudo systemctl restart systemd-binfmt || true
          ls /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Fetch kernel modules
        uses: actions/download-artifact@v4
        with:
          name: modules

      - name: Debootstrap Debian rootfs
        run: |
          # Deliberately minimal: nothing beyond what the board needs to boot,
          # accept a login and bring up Wi-Fi. ca-certificates and netbase are
          # not optional - without them there is no /etc/hosts, no
          # /etc/services, no trust store, and apt over https fails.
          sudo debootstrap --arch=arm64 --variant=minbase \
            --include=iptables,systemd,systemd-sysv,udev,dbus,openssh-server,iproute2,iputils-ping,network-manager,nano,less,locales,sudo,kmod,e2fsprogs,tzdata,wpasupplicant,rfkill,fake-hwclock,ca-certificates,netbase \
            trixie rootfs/ http://deb.debian.org/debian

      - name: Install modules into rootfs
        run: |
          # The modules_install output, not a hand-copied .ko tree: this
          # tarball is exactly what "make INSTALL_MOD_PATH=... modules_install"
          # produced, depmod metadata included.
          sudo mkdir -p rootfs/usr/lib/modules
          sudo tar -xpf modules.tar.gz -C rootfs/usr/lib/modules
          VER=$(ls rootfs/usr/lib/modules)
          echo "installed module tree: $VER"
          test -n "$VER"

      - name: Copy device overlay
        run: |
          # rootfs-overlay/ holds everything the board needs that is neither an
          # apt package nor a kernel module: the MTK Wi-Fi firmware blobs, the
          # gnt-conn bring-up tools, the systemd units and the sysctl /
          # modules-load files.
          sudo cp -a rootfs-overlay/. rootfs/
          sudo chmod 755 \
            rootfs/usr/local/libexec/gnt-conn \
            rootfs/usr/local/libexec/gnt-conn/tools \
            rootfs/usr/local/libexec/gnt-conn/conn-prep.sh \
            rootfs/usr/local/libexec/gnt-conn/conn-wifi.sh \
            rootfs/usr/local/libexec/gnt-conn/tools/wmtload \
            rootfs/usr/local/libexec/gnt-conn/tools/wmtserve \
            rootfs/usr/local/sbin/kexec-load \
            rootfs/usr/local/sbin/spread-device-irqs.sh \
            rootfs/usr/local/sbin/sysinfo \
            rootfs/usr/local/sbin/usb-gadget.sh \
            rootfs/etc/NetworkManager/dispatcher.d/50-wlan0-mtu
          # unit files land 644 from the repo already. The glob also
          # matches dbus-activation symlinks Debian's postinst created
          # (dbus-fi.w1.wpa_supplicant1.service,
          # dbus-org.freedesktop.nm-dispatcher.service): they point to
          # /lib/systemd/system/... which does not exist on the runner
          # outside the chroot, so chmod aborted on the dangling link.
          for u in rootfs/etc/systemd/system/*.service; do
              [ -f "$u" ] || continue
              sudo chmod 644 "$u"
          done

      - name: Place conn kernel-release
        run: |
          # tells gnt-conn which UTS_VERSION the vendor .ko were built
          # against; the overlay ships a dev-machine copy as the default
          sudo mv rootfs/usr/lib/modules/.conn-release \
            rootfs/usr/local/libexec/gnt-conn/kernel-release
          cat rootfs/usr/local/libexec/gnt-conn/kernel-release

      - name: Configure rootfs
        run: |
          sudo bash rootfs-setup.sh rootfs/

      - name: Create ext4 image
        run: |
          sudo bash make-rootfs-img.sh rootfs/ rootfs.img 6G

      - name: Verify rootfs image
        run: |
          e2fsck -fn rootfs.img | tail -3
          tune2fs -l rootfs.img | grep -iE 'volume name|filesystem uuid'
          # the board only boots when modules, firmware and units made it in
          sudo mkdir -p /mnt/img
          sudo mount -o loop,ro rootfs.img /mnt/img
          ls /mnt/img/usr/lib/modules/*/modules.builtin >/dev/null
          ls /mnt/img/usr/lib/firmware/WIFI_RAM_CODE_soc2_2_1_1.bin >/dev/null
          ls /mnt/img/usr/local/libexec/gnt-conn/conn-prep.sh >/dev/null
          # wants entries are symlinks with absolute targets; inside a
          # loop mount -e would resolve them against the RUNNER root and
          # fail. Assert the link itself exists.
          test -L /mnt/img/etc/systemd/system/multi-user.target.wants/gnt-conn.service
          test -L /mnt/img/etc/systemd/system/basic.target.wants/ufs-hungtask-tune.service
          ls /mnt/img/usr/lib/modules/*/updates/wlan/core/gen4m/wlan_6833_axi.ko >/dev/null
          grep -q 'updates/common/wmt_drv.ko' /mnt/img/usr/lib/modules/*/modules.dep
          [ "$(find /mnt/img/usr/lib/modules -name '*.ko*' | wc -l)" -ge 73 ]
          test ! -s /mnt/img/etc/machine-id
          sudo umount /mnt/img
          echo "rootfs contents OK"

      - name: Upload rootfs image
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-img
          path: rootfs.img
