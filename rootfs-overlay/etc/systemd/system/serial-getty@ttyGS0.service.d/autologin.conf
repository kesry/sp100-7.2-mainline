[Service]
ExecStart=
# --autologin root makes agetty exec `login -f root`, which skips the password.
#
# Do NOT add `-o '-p -- \u'` here: the `--` in that option string terminates
# login's own option parsing, so the `-f` that --autologin relies on is dropped
# and login falls back to asking for root's password. That is exactly what the
# previous image did, and the console prompted even though --autologin was set.
ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud 115200,38400,9600 ttyGS0 vt100
Restart=always
