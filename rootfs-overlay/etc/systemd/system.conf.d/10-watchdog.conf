# GNT-AN00 watchdog policy.
#
# The PSCI SYSTEM_RESET call in this firmware intermittently never returns.
# When that happens the kernel sits inside machine_restart() forever after
# printing "reboot: Restarting system", and the machine has to be power-cycled
# by hand. Measured on this board: roughly one reboot in three.
#
# A restart handler cannot fix it. Every attempt to take over the reset from
# mtk_wdt_restart() failed:
#
#   WDT_MODE=0x1   (EN only)           no reset
#   WDT_MODE=0x5   (EN|EXRST_EN)       no reset
#   WDT_MODE=0x55  (+AUTO_START|DUAL)  no reset
#   forcing EXRST + SWRST loop         hung, worse than before
#   restart priority 128 -> 255        handler runs, still no reset
#
# So let systemd-shutdown own the watchdog instead.
#
# RuntimeWatchdogSec keeps the TOP RGU armed while the system runs.
#
# RebootWatchdogSec=20 is what actually matters: systemd-shutdown takes the
# watchdog over for the reboot and keeps petting it, so when machine_restart()
# wedges the hardware resets the SoC twenty seconds later. That turns "dead
# machine, go find a cable" into "a reboot that takes 90 extra seconds".
#
# A previous revision of this file argued the opposite - that RebootWatchdogSec
# would overwrite the restart handler's shorter timeout. That reasoning was
# wrong: the restart handler never reset anything, so there was no working
# path to protect. Slow beats dead.
#
# Data safety: systemd-shutdown only takes the watchdog over after unmounting
# everything, remounting the root filesystem read-only, syncing and flushing
# the SCSI caches. Verified afterwards with "Filesystem state: clean" and no
# journal recovery.
[Manager]
RuntimeWatchdogSec=20
RebootWatchdogSec=20
KExecWatchdogSec=off
