# Bridge netfilter and container NAT do not mix on this board.
#
# With net.bridge.bridge-nf-call-iptables=1 a frame bridged from a container
# veth into the bridge is pushed through the iptables POSTROUTING nat hook
# *before* the kernel routes it, at which point the outgoing interface is the
# bridge itself:
#
#   MANGLELOG: IN= OUT=fwbr100i0 PHYSIN=veth100i0 ... TTL=64
#   MANGLELOG: IN=vmbr0 OUT=wlan0 PHYSIN=fwpr100p0 ... TTL=63
#
# The nat table is consulted on the first pass only. There OUT is the bridge,
# so a rule written as "-o wlan0 -j MASQUERADE" does not match, conntrack
# records "no NAT needed", and the packet is routed out wlan0 afterwards
# without SNAT - the container's private source address survives and nothing
# ever comes back. Symptom: the container can ping the bridge address but not
# the upstream gateway.
#
# Turning the callback off means bridged frames skip iptables and the nat
# lookup happens once, after routing, where -o <uplink> does match.
#
# Trade-off: the PVE per-VM firewall depends on this callback to filter bridged
# traffic. If it is enabled, container NAT has to be reworked.
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0
